name: Python tests and packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Test from the source distribution
        shell: bash
        run: |
          mkdir source-check
          tar -xzf dist/citebind-*.tar.gz -C source-check --strip-components=1
          cd source-check
          python -m pip install '.[dev]'
          python -m pytest -q
      - name: Test the wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/citebind-*.whl
          cd "$RUNNER_TEMP"
          python -m citebind --help
          python -m citebind make-spike --out sample
          python -m citebind inspect sample/spike_v1.docx
